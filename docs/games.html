<script>const Q=[{"q": "فهرس على (user_id, created_at) يخدم أي استعلام؟", "qe": "An index on (user_id, created_at) serves which query?", "o": [["a", "فلترة بـ user_id ثم ترتيب بـ created_at"], ["b", "فلترة بـ created_at وحده"], ["c", "فلترة بعمود غير مفهرس"], ["d", "لا يخدم أي استعلام"]], "a": "a", "x": "الفهرس المركب يُقرأ من اليسار، فيخدم العمود الأول ثم ما يليه."}, {"q": "لماذا لا يستفيد WHERE lower(email) = 'a@b.com' من فهرس عادي على email؟", "qe": "Why does WHERE lower(email) = 'a@b.com' not use a plain index on email?", "o": [["a", "لأن الدالة تغيّر القيمة المخزّنة في الفهرس"], ["b", "لأن النص طويل"], ["c", "لأن الفهرس معطّل تلقائيًا"], ["d", "لأن المساواة غير مدعومة"]], "a": "a", "x": "يحتاج الأمر فهرسًا تعبيريًا على lower(email)."}, {"q": "لماذا يصعب إبطال JWT قبل انتهاء صلاحيته؟", "qe": "Why is a JWT hard to revoke before it expires?", "o": [["a", "لأن التحقق لا يرجع إلى مخزن على الخادم"], ["b", "لأنه مشفّر بالكامل"], ["c", "لأنه يُخزَّن في المتصفح"], ["d", "لأنه طويل جدًا"]], "a": "a", "x": "التوكن مكتفٍ ذاتيًا، فالإبطال يحتاج قائمة منع أي حالة على الخادم."}, {"q": "ما أفضل مكان لتخزين توكن الجلسة في تطبيق ويب؟", "qe": "Where is the best place to store a session token in a web app?", "o": [["a", "كوكي HttpOnly و Secure و SameSite"], ["b", "localStorage"], ["c", "متغير عام في الصفحة"], ["d", "داخل عنوان الرابط"]], "a": "a", "x": "الكوكي HttpOnly غير مقروء لجافاسكربت فيقاوم سرقة XSS."}, {"q": "أي خاصيتين تعالجان في مرحلة الدمج دون إعادة تخطيط؟", "qe": "Which two properties are handled by the compositor without layout?", "o": [["a", "transform و opacity"], ["b", "width و height"], ["c", "margin و padding"], ["d", "top و left"]], "a": "a", "x": "تنفذان على طبقة الدمج في وحدة الرسوميات دون إعادة حساب الهندسة."}, {"q": "ما التصرف الذي يسبب layout thrashing؟", "qe": "Which behaviour causes layout thrashing?", "o": [["a", "تبديل القراءة والكتابة الهندسية داخل حلقة"], ["b", "تجميع كل القراءات ثم كل الكتابات"], ["c", "استخدام requestAnimationFrame"], ["d", "تصغير حجم الصور"]], "a": "a", "x": "كل قراءة بعد كتابة تجبر المتصفح على إعادة تخطيط فوري."}, {"q": "أيهما ينفذ أولًا بعد إفراغ المكدس؟", "qe": "Which runs first once the call stack empties?", "o": [["a", "المهام الدقيقة مثل ردود الوعود"], ["b", "مؤقّت بصفر ملي ثانية"], ["c", "أحداث النقر"], ["d", "طلبات الشبكة"]], "a": "a", "x": "تفرغ حلقة الأحداث طابور المهام الدقيقة كاملًا قبل أي مهمة كبرى."}, {"q": "ما أفضل حل لسباق نتائج البحث الحي؟", "qe": "Best fix for a live-search response race?", "o": [["a", "إلغاء الطلب السابق أو تجاهل الاستجابات القديمة"], ["b", "زيادة مهلة الطلب"], ["c", "استخدام setInterval"], ["d", "جعل الطلب متزامنًا"]], "a": "a", "x": "المشكلة ترتيبية لا زمنية، لذا الإلغاء أو ختم الطلبات هو الحل."}],F=[{"f": "ما هو الفهرس فعليًا", "b": "الفهرس بنية إضافية مرتبة، غالبًا شجرة B-Tree، تخزن قيم عمود مع مؤشرات إلى صفوفها. بدلًا من قراءة ملايين الصفوف تنزل قاعدة البيانات في الشجرة بعدد قليل من القفزات. الثمن أن كل إدخال أو تحديث يجب أن يحدّث الفهرس أيضًا، وأن…"}, {"f": "الانتقائية وترتيب الأعمدة", "b": "الفهرس مفيد عندما يستبعد نسبة كبيرة من الصفوف. فهرس على عمود بقيمتين فقط نادرًا ما يستخدم. في الفهرس المركب يهم الترتيب: فهرس على (user_id, created_at) يخدم البحث بـ user_id وحده وبالاثنين معًا، لكنه لا يخدم البحث بـ cre…"}, {"f": "اقرأ خطة التنفيذ", "b": "لا تخمّن، اقرأ الخطة. في PostgreSQL يكشف EXPLAIN ANALYZE عن Seq Scan مقابل Index Scan، وعن الفرق بين التقدير والواقع، وعن عدد الصفوف المزالة بالفلتر. فرق كبير بين المقدر والفعلي يعني إحصاءات قديمة تحتاج ANALYZE. وجود Seq…"}, {"f": "متى يضر الفهرس", "b": "الإفراط في الفهارس يبطئ الكتابة ويستهلك الذاكرة ويربك المخطط. كذلك تعطّل الدوال المطبقة على العمود استخدام الفهرس، فمثلًا WHERE lower(email) = ... لن يستفيد من فهرس عادي على email بل يحتاج فهرسًا تعبيريًا. وفي الجداول ال…"}, {"f": "الجلسة مقابل التوكن", "b": "في نموذج الجلسة يحتفظ الخادم بسجل الجلسة ويعطي المتصفح معرفًا داخل كوكي. في نموذج JWT يحمل التوكن نفسه البيانات موقّعة، فلا يحتاج الخادم إلى بحث. الفرق الجوهري في الإبطال: حذف صف الجلسة ينهي الوصول فورًا، بينما يبقى JWT …"}, {"f": "توكن وصول قصير وتوكن تجديد", "b": "التصميم العملي: توكن وصول قصير العمر من خمس إلى خمس عشرة دقيقة، وتوكن تجديد طويل مخزّن على الخادم وقابل للإبطال، مع تدوير التوكن عند كل تجديد. إذا استُخدم توكن تجديد قديم مرتين فهذه إشارة سرقة تستوجب إنهاء كل جلسات المست…"}, {"f": "أين تُخزَّن التوكنات", "b": "تخزين التوكن في localStorage يعرّضه لأي ثغرة XSS لأن أي سكربت يستطيع قراءته. الأفضل كوكي بخصائص HttpOnly و Secure و SameSite، فلا يصل إليه جافاسكربت، مع حماية من CSRF عبر SameSite أو توكن مضاد. وتذكّر أن محتوى JWT مقروء …"}, {"f": "التحقق الصارم من التوقيع", "b": "ثبّت الخوارزمية على الخادم ولا تثق بحقل alg القادم من التوكن، فهجوم alg=none أو تبديل RS256 بـ HS256 هجوم كلاسيكي. تحقق أيضًا من المُصدر والجمهور وزمن الانتهاء، واستخدم مقارنة ثابتة الزمن. أخيرًا ضع خطة تدوير للمفاتيح مع…"}, {"f": "التحليل وبناء DOM", "b": "يحوّل المتصفح بايتات HTML إلى محارف ثم رموز ثم عقد ثم شجرة DOM. التحليل تدريجي فيمكن بدء العرض قبل اكتمال المستند، لكن أي وسم script بدون defer يوقف المحلل لأن السكربت قد يعدّل البنية. لهذا توضع السكربتات في نهاية الجسم …"}, {"f": "CSSOM ومنع العرض", "b": "بالتوازي يبني المتصفح شجرة CSSOM، ولا يرسم شيئًا قبل معرفة الأنماط النهائية وإلا ظهر محتوى غير منسق ثم قفز. لذلك كل ملف أنماط في الرأس يؤخر أول رسم. الحل العملي: تقليل الأنماط الحرجة، ووضع أنماط الشاشة الأولى داخل الصفحة…"}, {"f": "التخطيط والرسم والدمج", "b": "بعد دمج الشجرتين يحسب المتصفح موضع وحجم كل صندوق، ثم يرسم البكسلات، ثم يدمج الطبقات على وحدة الرسوميات. تغيير العرض أو الارتفاع يعيد التخطيط، وتغيير اللون يعيد الرسم فقط، بينما transform و opacity تعالجان في الدمج وحده. …"}, {"f": "الاهتزاز والقياس القسري", "b": "يحاول المتصفح تسليم إطار كل ست عشرة ملي ثانية. إذا قرأت خاصية هندسية مثل offsetHeight مباشرة بعد كتابة نمط أجبرته على إعادة تخطيط فوري وسط الإطار. الحل فصل القراءات عن الكتابات: اقرأ القياسات كلها ثم طبّق التغييرات داخل …"}, {"f": "خيط واحد ومكدس واحد", "b": "تعمل جافاسكربت في المتصفح على خيط واحد بمكدس واحد، فأي عملية طويلة متزامنة تجمّد الواجهة كلها. لذلك تُسلَّم الأعمال الطويلة إلى واجهات المتصفح مثل fetch و setTimeout و Web Workers ويعود الناتج كمهمة في طابور. التزامن هنا…"}, {"f": "المهام الدقيقة قبل الكبرى", "b": "بعد إفراغ المكدس تنفذ كل المهام الدقيقة، مثل ردود الوعود، قبل أي مهمة كبرى مثل المؤقتات والأحداث. لهذا يظهر رد الوعد قبل مؤقّت بصفر ملي ثانية. وهذا سلاح ذو حدين: سلسلة وعود لا تنتهي تمنع المتصفح من الوصول إلى مرحلة الرسم…"}, {"f": "async/await ليس سحرًا", "b": "الدالة async ترجع وعدًا دائمًا، وكل await يقسم الدالة: ما بعده يُجدول كمهمة دقيقة عند استقرار الوعد. لذلك await داخل حلقة يعني طلبات متسلسلة بطيئة، بينما Promise.all يشغّلها معًا. استخدم try/catch حول await، وتذكر أن وعد…"}, {"f": "الإلغاء وسباقات الحالة", "b": "في البحث الحي يكتب المستخدم بسرعة فتنطلق عدة طلبات، وقد يصل الطلب القديم بعد الجديد فيكتب فوق النتيجة الصحيحة. الحل AbortController لإلغاء الطلب السابق أو حفظ معرف آخر طلب وتجاهل ما هو أقدم. هذه ليست حالة نادرة بل السبب …"}];let p=0,i=0,t,tm,fi=0,flip=0;const $=s=>document.getElementById(s);$("best").textContent=localStorage.drBest||0;
function badge(){$("badge").textContent=p>=100?"🏆 خبير":p>=50?"🥈 متقدم":p>=20?"🥉 مبتدئ واعد":""}
function ask(){clearInterval(tm);if(i>=Q.length){$("qa").innerHTML="<h3>انتهى! نتيجتك "+p+"</h3>";if(p>(localStorage.drBest||0)){localStorage.drBest=p;$("best").textContent=p}return}const q=Q[i];t=15;$("qa").innerHTML="<p><b>"+q.q+"</b><br><span class=en>"+q.qe+"</span></p><p>⏳ <span id=tt>15</span></p>"+q.o.map(o=>"<button class=o data-id="+o[0]+">"+o[1]+"</button>").join("")+"<p id=ex></p>";
tm=setInterval(()=>{if(--t<=0){clearInterval(tm);done(null)}$("tt").textContent=t},1000);document.querySelectorAll("#qa .o").forEach(b=>b.onclick=()=>done(b))}
function done(b){clearInterval(tm);const q=Q[i];document.querySelectorAll("#qa .o").forEach(x=>{x.disabled=true;if(x.dataset.id==q.a)x.classList.add("ok")});if(b){if(b.dataset.id==q.a)p+=10+t;else b.classList.add("bad")}$("pts").textContent=p;badge();$("ex").innerHTML=q.x+"<br><button id=go>التالي</button>";$("go").onclick=()=>{i++;ask()}}
$("st").onclick=()=>{p=0;i=0;Q.sort(()=>Math.random()-.5);ask()};
function card(){const c=F[fi%F.length];$("fc").innerHTML=flip?"<p>"+c.b+"</p>":"<h3>"+c.f+"</h3><small>اضغط لقلب البطاقة</small>"}$("fc").onclick=()=>{flip^=1;card()};$("nx").onclick=()=>{fi++;flip=0;card()};card()</script>
