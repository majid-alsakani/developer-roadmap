<style>
:root{--bg:#0b1220;--card:#111c31;--line:#22304d;--fg:#e8eefc;--mut:#93a5c4;--acc:#4f9dff;--acc2:#7ee7ff}
html[data-theme=light]{--bg:#f6f8fc;--card:#ffffff;--line:#dfe6f2;--fg:#0b1220;--mut:#5a6b8a;--acc:#1f6feb;--acc2:#0b8f9e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
header.hero{text-align:center;padding:48px 16px 28px;background:radial-gradient(900px 340px at 50% -60px,rgba(79,157,255,.22),transparent)}
h1{font-size:clamp(30px,5vw,50px);margin:0 0 8px;background:linear-gradient(90deg,var(--fg),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:18px;margin:0 auto;max-width:640px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0 6px}
button,input{font:inherit}
.btn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
#q{width:100%;max-width:560px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);outline:none}
#q:focus{border-color:var(--acc)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;transition:.22s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.card .ic{font-size:30px}
.card h3{margin:0;font-size:19px}
.card .ar{color:var(--acc2);font-size:15px;margin:0}
.card p{color:var(--mut);margin:4px 0 0;font-size:14px}
.card .go{margin-top:auto;padding-top:12px;font-weight:600}
.stats{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:26px;color:var(--mut);font-size:14px}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:46px;border-top:1px solid var(--line);padding-top:22px}
html[dir=rtl] body{text-align:right}
</style>

<body>
<header class="hero">
  <h1 data-en="Developer Roadmap" data-ar="خارطة طريق المطوّر">Developer Roadmap</h1>
  <p class="sub" data-en="Bilingual, opinionated, up-to-date learning paths — from your first line of code to senior engineer."
     data-ar="مسارات تعلّم ثنائية اللغة ومحدّثة — من أول سطر كود إلى مهندس خبير.">Bilingual, opinionated, up-to-date learning paths — from your first line of code to senior engineer.</p>
  <div class="bar">
    <button class="btn p" id="lang">🌐 العربية</button>
    <button class="btn" id="theme">🌙 Dark / Light</button>
    <a class="btn" href="https://github.com/majid-alsakani/developer-roadmap">⭐ Star on GitHub</a>
  </div>
  <div class="bar"><input id="q" placeholder="Search roadmaps… / ابحث عن مسار…" aria-label="Search roadmaps"/></div>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="stats">
    <span>8 roadmaps</span><span>·</span><span>EN / AR</span><span>·</span><span>Updated 2026-08-01</span><span>·</span><span>CC BY-SA 4.0</span>
  </div>
  <footer>
    Built by <a href="https://github.com/majid-alsakani">Majid Al-Sakani · ماجد السكني</a> — Full Stack Developer, Yemen 🇾🇪<br/>
    <a href="https://github.com/majid-alsakani/developer-roadmap/blob/main/CONTRIBUTING.md">Contribute</a> ·
    <a href="https://github.com/majid-alsakani/developer-roadmap/issues">Report an issue</a>
  </footer>
</main>
<script>
const DATA = [{"slug": "frontend", "en": "Frontend Developer", "ar": "مطور الواجهات الأمامية", "icon": "🎨", "desc_en": "From HTML fundamentals to production-grade React architecture.", "desc_ar": "من أساسيات HTML إلى معمارية React جاهزة للإنتاج."}, {"slug": "backend", "en": "Backend Developer", "ar": "مطور الواجهات الخلفية", "icon": "🛠️", "desc_en": "APIs, databases, queues and distributed systems done properly.", "desc_ar": "واجهات برمجية وقواعد بيانات وطوابير وأنظمة موزعة بشكل صحيح."}, {"slug": "python", "en": "Python Engineer", "ar": "مهندس بايثون", "icon": "🐍", "desc_en": "Modern Python: typing, async, packaging and performance.", "desc_ar": "بايثون الحديثة: الأنواع، التزامن، التغليف والأداء."}, {"slug": "devops", "en": "DevOps / SRE", "ar": "هندسة العمليات والموثوقية", "icon": "⚙️", "desc_en": "Ship safely, observe everything, automate the boring parts.", "desc_ar": "نشر آمن، مراقبة شاملة، وأتمتة كل ما هو ممل."}, {"slug": "ai-engineer", "en": "AI / Agents Engineer", "ar": "مهندس الذكاء الاصطناعي والوكلاء", "icon": "🤖", "desc_en": "From prompts to production agents with tools, memory and evals.", "desc_ar": "من التلقين إلى وكلاء إنتاجيين بأدوات وذاكرة وتقييم."}, {"slug": "fullstack", "en": "Full Stack Developer", "ar": "مطور متكامل", "icon": "🚀", "desc_en": "One person, one product: frontend, backend, data and delivery.", "desc_ar": "شخص واحد، منتج كامل: واجهة وخلفية وبيانات ونشر."}, {"slug": "mobile", "en": "Mobile Developer", "ar": "مطور تطبيقات الجوال", "icon": "📱", "desc_en": "Cross-platform apps that feel native on both stores.", "desc_ar": "تطبيقات متعددة المنصات بإحساس أصلي على المتجرين."}, {"slug": "data", "en": "Data Engineer", "ar": "مهندس البيانات", "icon": "📊", "desc_en": "Reliable pipelines, modeled warehouses, trusted metrics.", "desc_ar": "خطوط بيانات موثوقة ومستودعات منمذجة ومؤشرات جديرة بالثقة."}];
const BASE = "https://github.com/majid-alsakani/developer-roadmap/blob/main/roadmaps/";
let lang = localStorage.getItem("dr_lang") || "en";
const grid = document.getElementById("grid");
function render(filter=""){
  const f = filter.trim().toLowerCase();
  grid.innerHTML = DATA.filter(r => !f || (r.en+r.ar+r.slug+r.desc_en+r.desc_ar).toLowerCase().includes(f))
    .map(r => `<a class="card" href="${BASE}${r.slug}.md">
      <div class="ic">${r.icon}</div>
      <h3>${lang==="ar"?r.ar:r.en}</h3>
      <p class="ar">${lang==="ar"?r.en:r.ar}</p>
      <p>${lang==="ar"?r.desc_ar:r.desc_en}</p>
      <div class="go">${lang==="ar"?"افتح الخريطة ←":"Open roadmap →"}</div>
    </a>`).join("") || `<p style="color:var(--mut)">No match / لا نتائج</p>`;
}
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-en]").forEach(el => el.textContent = el.dataset[lang]);
  document.getElementById("lang").textContent = lang === "ar" ? "🌐 English" : "🌐 العربية";
  localStorage.setItem("dr_lang", lang);
  render(document.getElementById("q").value);
}
document.getElementById("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; applyLang(); };
const themeBtn = document.getElementById("theme");
function applyTheme(t){ document.documentElement.dataset.theme = t; localStorage.setItem("dr_theme", t); }
themeBtn.onclick = () => applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
applyTheme(localStorage.getItem("dr_theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
document.getElementById("q").addEventListener("input", e => render(e.target.value));
applyLang();
</script>
</body>
